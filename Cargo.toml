[workspace]
resolver = "2"
members = ["framework-core", "framework-datetime"]

[workspace.package]
version = "26.8.14"
edition = "2024"
rust-version = "1.93.0"
authors = ["lingting"]
description = "lingting framework"
license = "MIT"

[workspace.dependencies]
aes = { version = "0.8" }
base64 = { version = "0.22" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_with = { version = "3.21" }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function", "bytes"] }
specta-typescript = { version = "0.0.12" }
specta-serde = { version = "0.0.12" }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
blake3 = { version = "1.8" }
url = { version = "2.5", features = ["serde"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1.0"
regex = { version = "1.12" }
chrono = { version = "0.4" }
log = { version = "0.4" }
bytes = { version = "1.11" }
flate2 = { version = "1.1" }
cbc = { version = "0.1" }
cipher = { version = "0.4" }
rand = { version = "0.8" }
hmac = { version = "0.12" }
sha1 = { version = "0.10" }
md-5 = { version = "0.10" }
wreq = { version = "5.3", features = ["socks"] }
rsntp = { version = "4.1", default-features = false }
sha2 = { version = "0.10" }
async-trait = { version = "0.1" }
arc-swap = { version = "1.8" }
dashmap = { version = "6.1" }
cef = { version = "149.3.0" }
tao = { version = "0.35" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
sqlx = { version = "0.8", default-features = false, features = ["any", "json", "macros", "postgres", "runtime-tokio-rustls", "sqlite"] }
proc-macro2 = { version = "1.0" }
quote = { version = "1.0" }
syn = { version = "2.0", features = ["full"] }

